
stages:
  validate_data:
    cmd: .\.venv\Scripts\python.exe validate_data.py
    deps:
      - validate_data.py
      - sms+spam+collection/SMSSpamCollection
    outs:
      - artifacts/data_validation.json

  prepare_data:
    cmd: .\.venv\Scripts\python.exe prepare_data.py
    deps:
      - prepare_data.py
      - sms+spam+collection/SMSSpamCollection
    outs:
      - artifacts/prepared_data.csv

  train:
    cmd: set "MLFLOW_ALLOW_FILE_STORE=true" && .\.venv\Scripts\python.exe train_model.py
    deps:
      - train_model.py
      - requirements.txt
      - artifacts/prepared_data.csv
    outs:
      - spam.model.joblib
    metrics:
      - artifacts/metrics.json

  check_model_quality:
    cmd: .\.venv\Scripts\python.exe check_model_quality.py
    deps:
      - check_model_quality.py
      - artifacts/metrics.json
    outs:
      - artifacts/quality_report.json

  test_api:
    cmd: .\.venv\Scripts\python.exe -m pytest -v --junitxml=pytest-report.xml
    deps:
      - app.py
      - tests/test_app.py
      - spam.model.joblib
      - requirements.txt
      - artifacts/quality_report.json
    outs:
      - pytest-report.xml
